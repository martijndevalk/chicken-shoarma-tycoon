# Deploy naar GitHub Pages
#
# Deze workflow draait wanneer je naar de `main`- of `master`- branch pusht.
# Hij bouwt de site en deployet hem naar de `gh-pages`-branch.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stel Node.js in (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Installeer dependencies
        run: npm ci --omit=dev

      - name: Build de site
        run: npm run build

      - name: Deploy naar GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # cname: jouwdomein.nl  # optioneel: eigen domein